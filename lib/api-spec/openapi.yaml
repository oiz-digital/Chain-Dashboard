openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Zebvix Chain (ZBX) Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chain
    description: Chain-level info and stats
  - name: blocks
    description: Block explorer
  - name: transactions
    description: Transaction explorer
  - name: validators
    description: Validators and staking
  - name: wallet
    description: Wallet and address lookup
  - name: tokens
    description: ZBX token economics
  - name: defi
    description: DeFi and liquidity stats
  - name: staking
    description: Staking protocol
  - name: admin
    description: Admin panel operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /chain/info:
    get:
      operationId: getChainInfo
      tags: [chain]
      summary: Chain overview info
      responses:
        "200":
          description: Chain info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainInfo"

  /chain/stats:
    get:
      operationId: getChainStats
      tags: [chain]
      summary: Live chain statistics
      responses:
        "200":
          description: Chain stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainStats"

  /blocks:
    get:
      operationId: listBlocks
      tags: [blocks]
      summary: List recent blocks
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of blocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockList"

  /blocks/{height}:
    get:
      operationId: getBlock
      tags: [blocks]
      summary: Get block by height
      parameters:
        - name: height
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Block detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockDetail"
        "404":
          description: Block not found

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List recent transactions
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"

  /transactions/{hash}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get transaction by hash
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDetail"
        "404":
          description: Transaction not found

  /validators:
    get:
      operationId: listValidators
      tags: [validators]
      summary: List all validators
      responses:
        "200":
          description: List of validators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Validator"

  /validators/{address}:
    get:
      operationId: getValidator
      tags: [validators]
      summary: Get validator detail
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Validator detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidatorDetail"
        "404":
          description: Validator not found

  /wallet/{address}:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get wallet info by address
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
        "404":
          description: Address not found

  /wallet/{address}/transactions:
    get:
      operationId: getWalletTransactions
      tags: [wallet]
      summary: Get recent transactions for a wallet address (last 20)
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Wallet transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"

  /tokens/stats:
    get:
      operationId: getTokenStats
      tags: [tokens]
      summary: ZBX token economics and supply stats
      responses:
        "200":
          description: Token stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenStats"

  /defi/stats:
    get:
      operationId: getDefiStats
      tags: [defi]
      summary: DeFi protocol overview stats
      responses:
        "200":
          description: DeFi stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefiStats"

  /dex/pools:
    get:
      operationId: listDexPools
      tags: [defi]
      summary: List AMM liquidity pools
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: sortBy
          schema: { type: string, enum: [tvl, volume, apy, fees], default: tvl }
      responses:
        "200":
          description: List of liquidity pools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPoolsResponse"

  /dex/pools/{id}:
    get:
      operationId: getDexPool
      tags: [defi]
      summary: Single liquidity pool details
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Pool details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DexPool"

  /dex/swap/quote:
    get:
      operationId: getSwapQuote
      tags: [defi]
      summary: Get swap quote for a token pair
      parameters:
        - in: query
          name: tokenIn
          required: true
          schema: { type: string }
        - in: query
          name: tokenOut
          required: true
          schema: { type: string }
        - in: query
          name: amountIn
          required: true
          schema: { type: string }
        - in: query
          name: slippage
          schema: { type: string, default: "0.5" }
      responses:
        "200":
          description: Swap quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapQuote"

  /dex/swaps:
    get:
      operationId: listSwapTransactions
      tags: [defi]
      summary: Recent swap transactions
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: poolId
          schema: { type: integer }
      responses:
        "200":
          description: List of swap transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSwapsResponse"

  /staking/overview:
    get:
      operationId: getStakingOverview
      tags: [staking]
      summary: Staking protocol overview and stats
      responses:
        "200":
          description: Staking overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StakingOverview"

  /staking/validators:
    get:
      operationId: getStakingValidators
      tags: [staking]
      summary: Validators with staking APR and delegation info
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Staking validators list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StakingValidatorList"

  # ─── GOVERNANCE ──────────────────────────────────────────────────────────────
  /governance/proposals:
    get:
      operationId: listGovernanceProposals
      tags: [governance]
      summary: List governance proposals
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: status
          schema: { type: string, enum: [all, voting_period, passed, rejected, deposit_period, failed], default: all }
      responses:
        "200":
          description: List of proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceProposalList"

  /governance/proposals/{id}:
    get:
      operationId: getGovernanceProposal
      tags: [governance]
      summary: Single proposal detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Proposal detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceProposal"

  /governance/params:
    get:
      operationId: getGovernanceParams
      tags: [governance]
      summary: Governance parameters
      responses:
        "200":
          description: Governance params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceParams"

  # ─── ANALYTICS ───────────────────────────────────────────────────────────────
  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Price, TVL, volume history for charts
      parameters:
        - in: query
          name: days
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  # ─── IBC ─────────────────────────────────────────────────────────────────────
  /ibc/channels:
    get:
      operationId: listIbcChannels
      tags: [ibc]
      summary: List IBC channels
      responses:
        "200":
          description: IBC channels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IbcChannelList"

  # ─── LEADERBOARD ─────────────────────────────────────────────────────────────
  /leaderboard/accounts:
    get:
      operationId: listLeaderboardAccounts
      tags: [explorer]
      summary: Top accounts by balance
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Top accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListLeaderboardResponse"

  /chain/activity:
    get:
      operationId: getChainActivity
      tags: [chain]
      summary: Block-by-block tx count for chart (last 24 blocks)
      responses:
        "200":
          description: Activity data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityPoint"

  # ─── ADMIN ENDPOINTS ─────────────────────────────────────────────────────────

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Admin dashboard overview stats
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/validators:
    get:
      operationId: adminListValidators
      tags: [admin]
      summary: List all validators (admin)
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, jailed]
      responses:
        "200":
          description: Paginated validator list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminValidatorList"
    post:
      operationId: adminCreateValidator
      tags: [admin]
      summary: Add a new validator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidatorInput"
      responses:
        "201":
          description: Validator created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminValidator"

  /admin/validators/{id}:
    patch:
      operationId: adminUpdateValidator
      tags: [admin]
      summary: Update validator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidatorUpdate"
      responses:
        "200":
          description: Updated validator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminValidator"
        "404":
          description: Not found
    delete:
      operationId: adminDeleteValidator
      tags: [admin]
      summary: Remove a validator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /admin/tokens:
    get:
      operationId: adminListTokens
      tags: [admin]
      summary: List token registry (admin)
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Token list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTokenList"
    post:
      operationId: adminCreateToken
      tags: [admin]
      summary: Add a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenInput"
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminToken"

  /admin/tokens/{id}:
    patch:
      operationId: adminUpdateToken
      tags: [admin]
      summary: Update token
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenUpdate"
      responses:
        "200":
          description: Updated token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminToken"
        "404":
          description: Not found
    delete:
      operationId: adminDeleteToken
      tags: [admin]
      summary: Remove a token
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /admin/ai-models:
    get:
      operationId: adminListAiModels
      tags: [admin]
      summary: List AI models registry
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: AI model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAiModelList"
    post:
      operationId: adminCreateAiModel
      tags: [admin]
      summary: Register an AI model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiModelInput"
      responses:
        "201":
          description: AI model registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAiModel"

  /admin/ai-models/{id}:
    patch:
      operationId: adminUpdateAiModel
      tags: [admin]
      summary: Update AI model
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiModelUpdate"
      responses:
        "200":
          description: Updated AI model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAiModel"
        "404":
          description: Not found
    delete:
      operationId: adminDeleteAiModel
      tags: [admin]
      summary: Remove AI model
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List admin users
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Admin user list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
    post:
      operationId: adminCreateUser
      tags: [admin]
      summary: Create admin user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "201":
          description: Admin user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserRecord"

  /admin/users/{id}:
    patch:
      operationId: adminUpdateUser
      tags: [admin]
      summary: Update admin user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserRecord"
        "404":
          description: Not found
    delete:
      operationId: adminDeleteUser
      tags: [admin]
      summary: Remove admin user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /admin/settings:
    get:
      operationId: adminListSettings
      tags: [admin]
      summary: List system settings
      responses:
        "200":
          description: Settings list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemSetting"

  /admin/settings/{key}:
    patch:
      operationId: adminUpdateSetting
      tags: [admin]
      summary: Update a system setting by key
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingUpdate"
      responses:
        "200":
          description: Updated setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSetting"
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ChainInfo:
      type: object
      required:
        - chainId
        - chainName
        - token
        - decimals
        - blockTime
        - latestHeight
        - totalSupplyCap
        - minValidatorStake
        - minDelegatorStake
        - consensus
        - networkId
      properties:
        chainId:
          type: integer
        chainName:
          type: string
        token:
          type: string
        decimals:
          type: integer
        blockTime:
          type: integer
        latestHeight:
          type: integer
        totalSupplyCap:
          type: string
        minValidatorStake:
          type: string
        minDelegatorStake:
          type: string
        consensus:
          type: string
        networkId:
          type: string

    ChainStats:
      type: object
      required:
        - latestHeight
        - tps
        - avgBlockTime
        - totalTransactions
        - totalAddresses
        - activeValidators
        - totalStaked
        - circulatingSupply
        - marketCap
        - zbxPriceUsd
      properties:
        latestHeight:
          type: integer
        tps:
          type: number
        avgBlockTime:
          type: number
        totalTransactions:
          type: integer
        totalAddresses:
          type: integer
        activeValidators:
          type: integer
        totalStaked:
          type: string
        circulatingSupply:
          type: string
        marketCap:
          type: string
        zbxPriceUsd:
          type: number

    Block:
      type: object
      required:
        - height
        - hash
        - timestamp
        - txCount
        - validator
        - gasUsed
        - gasLimit
        - size
        - reward
      properties:
        height:
          type: integer
        hash:
          type: string
        timestamp:
          type: string
        txCount:
          type: integer
        validator:
          type: string
        gasUsed:
          type: integer
        gasLimit:
          type: integer
        size:
          type: integer
        reward:
          type: string

    BlockList:
      type: object
      required: [blocks, total, page, limit]
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/Block"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    BlockDetail:
      type: object
      required:
        - height
        - hash
        - parentHash
        - timestamp
        - txCount
        - validator
        - gasUsed
        - gasLimit
        - size
        - reward
        - stateRoot
        - txHash
      properties:
        height:
          type: integer
        hash:
          type: string
        parentHash:
          type: string
        timestamp:
          type: string
        txCount:
          type: integer
        validator:
          type: string
        gasUsed:
          type: integer
        gasLimit:
          type: integer
        size:
          type: integer
        reward:
          type: string
        stateRoot:
          type: string
        txHash:
          type: string
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"

    Transaction:
      type: object
      required:
        - hash
        - blockHeight
        - timestamp
        - from
        - to
        - amount
        - fee
        - status
        - type
      properties:
        hash:
          type: string
        blockHeight:
          type: integer
        timestamp:
          type: string
        from:
          type: string
        to:
          type: string
        amount:
          type: string
        fee:
          type: string
        status:
          type: string
          enum: [success, failed, pending]
        type:
          type: string
          enum: [transfer, stake, unstake, delegate, contract, reward]

    TransactionList:
      type: object
      required: [transactions, total, page, limit]
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    TransactionDetail:
      type: object
      required:
        - hash
        - blockHeight
        - timestamp
        - from
        - to
        - amount
        - fee
        - status
        - type
        - nonce
        - gasLimit
        - gasUsed
        - gasPrice
        - data
        - confirmations
      properties:
        hash:
          type: string
        blockHeight:
          type: integer
        timestamp:
          type: string
        from:
          type: string
        to:
          type: string
        amount:
          type: string
        fee:
          type: string
        status:
          type: string
          enum: [success, failed, pending]
        type:
          type: string
          enum: [transfer, stake, unstake, delegate, contract, reward]
        nonce:
          type: integer
        gasLimit:
          type: integer
        gasUsed:
          type: integer
        gasPrice:
          type: string
        data:
          type: string
        confirmations:
          type: integer

    Validator:
      type: object
      required:
        - address
        - moniker
        - status
        - votingPower
        - commission
        - totalStaked
        - delegators
        - uptime
        - blocksProposed
        - rank
      properties:
        address:
          type: string
        moniker:
          type: string
